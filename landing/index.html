<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Simple Personal Card</title>
        <meta name = 'viewport' content = "width = device-width,initial-scale = 1.0">
        <meta name = "description" content = "It represents simple personal card">
        <link rel = "stylesheet" href = "style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body>
        <div class = "profile-card">
            <div class = "image">
                <img class = "profile-img" src = "TechCrunch_Disrupt_Europe_Berlin_2013_(10536888854)_(cropped).jpg" alt = "brunnomars">
            </div>
            <div class = "text-data">
                <span class = "name">Pavel Durov</span>
                <span class = "job">Entrepreneur & Founder</span>
            </div>
            <div class = "media-buttons">
                <a  href = "#" class = "link" style = "background: #0866FF">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a  href = "#" class = "link" style = "background: #1DA1F2">
                    <i class="fa-brands fa-twitter"></i>
                </a>
                <a  href = "#" class = "link" style = "background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4)">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a  href = "#" class = "link" style = "background-color: #FF0033">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
            <div class = "buttons">
                <button class = "button">Subscribe</button>
                <button class = "button">Message</button>
            </div>
            <div class = "analytics">
                <div class = "data">
                    <i class="fa-regular fa-heart"></i>
                    <span class = "number">60K</span>
                </div>
                <div class = "data">
                    <i class="fa-regular fa-message"></i>
                    <span class = "number">20K</span>
                </div>
                <div class = "data">
                    <i class="fa-solid fa-share"></i>
                    <span class = "number">1.4K</span>
                </div>
            </div>
        </div>
    </body>
</html>
